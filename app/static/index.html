<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow · DevOps Demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; --ink:#eef2ff; --muted:#9aa5c3; --accent:#7c5cff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 15% 0,#27315f 0,transparent 35%),#0d1020; }
    main { width:min(920px,92%); margin:0 auto; padding:64px 0; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:36px; }
    h1 { margin:0; font-size:clamp(2rem,6vw,4rem); letter-spacing:-.06em; }
    .lead { color:var(--muted); max-width:540px; line-height:1.6; }
    .badge { padding:8px 14px; border:1px solid #3d4770; border-radius:999px; color:#74e0af; background:#17233c; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:24px 0; }
    .card { padding:20px; border:1px solid #303854; border-radius:18px; background:#171a2dcc; box-shadow:0 15px 50px #0003; }
    .number { font-size:2rem; font-weight:800; }
    .label { color:var(--muted); font-size:.9rem; }
    form { display:grid; grid-template-columns:1fr 2fr auto; gap:10px; }
    input,button { border-radius:10px; border:1px solid #38415f; padding:12px 14px; font:inherit; }
    input { background:#101425; color:var(--ink); }
    button { cursor:pointer; color:white; background:var(--accent); border:0; font-weight:700; }
    ul { list-style:none; padding:0; display:grid; gap:10px; }
    li { display:flex; align-items:center; gap:12px; padding:14px; background:#111527; border:1px solid #282f49; border-radius:12px; }
    li.done .task-title { text-decoration:line-through; color:var(--muted); }
    .task-title { flex:1; }
    .icon { padding:7px 10px; background:#262d48; }
    .links { color:var(--muted); margin-top:28px; } .links a { color:#b7a9ff; }
    @media (max-width:700px) { header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}form{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <header><div><h1>TaskFlow</h1><p class="lead">Egy apró alkalmazás, amelyen a teljes tesztelési és CI/CD folyamat bemutatható.</p></div><span class="badge" id="health">● ellenőrzés…</span></header>
  <section class="grid">
    <div class="card"><div class="number" id="total">0</div><div class="label">Összes feladat</div></div>
    <div class="card"><div class="number" id="pending">0</div><div class="label">Folyamatban</div></div>
    <div class="card"><div class="number" id="completed">0</div><div class="label">Elkészült</div></div>
  </section>
  <section class="card">
    <form id="task-form"><input id="title" required minlength="3" maxlength="100" placeholder="Feladat címe"><input id="description" maxlength="500" placeholder="Rövid leírás"><button>Hozzáadás</button></form>
    <ul id="tasks"></ul>
    <p id="empty" class="label">Még nincs feladat. Adj hozzá egyet!</p>
  </section>
  <p class="links">Fejlesztői dokumentáció: <a href="/docs">Swagger UI</a> · <a href="/redoc">ReDoc</a> · <a href="/health">Health check</a></p>
</main>
<script>
const api='/api/tasks';
async function refresh(){
  const [tasks,stats]=await Promise.all([fetch(api).then(r=>r.json()),fetch('/api/stats').then(r=>r.json())]);
  for(const key of ['total','pending','completed']) document.getElementById(key).textContent=stats[key];
  const list=document.getElementById('tasks'); list.innerHTML=''; document.getElementById('empty').hidden=tasks.length>0;
  tasks.forEach(task=>{const item=document.createElement('li'); item.className=task.completed?'done':'';
    const toggle=document.createElement('button');toggle.className='icon';toggle.textContent=task.completed?'✓':'○';toggle.title='Állapot váltása';toggle.onclick=()=>update(task.id,{completed:!task.completed});
    const title=document.createElement('span');title.className='task-title';title.textContent=task.title;title.title=task.description;
    const remove=document.createElement('button');remove.className='icon';remove.textContent='×';remove.title='Törlés';remove.onclick=()=>del(task.id);
    item.append(toggle,title,remove);list.append(item);});
}
async function update(id,body){await fetch(`${api}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});refresh()}
async function del(id){await fetch(`${api}/${id}`,{method:'DELETE'});refresh()}
document.getElementById('task-form').onsubmit=async event=>{event.preventDefault();const title=document.getElementById('title'),description=document.getElementById('description');await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:description.value})});event.target.reset();refresh()};
fetch('/health').then(r=>r.json()).then(()=>document.getElementById('health').textContent='● rendszer elérhető').catch(()=>document.getElementById('health').textContent='● hiba');refresh();
</script>
</body>
</html>
