name: CI pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Static code analysis
        run: ruff check .

      - name: Automated tests and coverage gate
        run: pytest

      - name: Publish coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag taskflow:${{ github.sha }} .

      - name: Run container
        run: docker run --detach --name taskflow-test --publish 8000:8000 taskflow:${{ github.sha }}

      - name: Smoke test health endpoint
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs taskflow-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force taskflow-test || true
